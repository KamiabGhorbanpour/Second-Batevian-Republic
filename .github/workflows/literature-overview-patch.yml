name: Apply concise literature overviews

on:
  push:
    paths:
      - '.github/workflows/literature-overview-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch packed application
        run: python scripts/literature_patch.py
      - name: Commit patch
        run: |
          git config user.name "Kamiab Ghorbanpour"
          git config user.email "k.ghorbanpour@tilburguniversity.edu"
          git add main.py
          git commit -m "Use concise literature overviews in ending flowchart"
          git push origin HEAD:main
